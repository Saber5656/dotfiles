# Extended keys (CSI u encoding) - WezTermのShift+Enter等を正しくパススルー
set -s extended-keys always
set -as terminal-features ',xterm-256color:extkeys'

# WezTermのRGBカラーサポート
set -as terminal-features ',xterm-256color:RGB'

# デフォルトターミナル
set -g default-terminal "tmux-256color"

# Shift+Enter パススルー (CSI u: \e[13;2u をそのまま内部アプリに転送)
set -s user-keys[0] "\e[13;2u"
bind-key -n User0 send-keys "\e[13;2u"

# ペイン移動 (prefix不要) - WezTermのCtrl+h/j/k/lと統一
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# マウスモード（スクロール、ペイン選択・リサイズ）
set -g mouse on

# コピーモードでviキーバインド
setw -g mode-keys vi
